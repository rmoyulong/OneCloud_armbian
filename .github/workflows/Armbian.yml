name: "官方版编译玩客云三代 Armbian"
on:
  workflow_dispatch:
     inputs:
      branch_version:
        type: choice
        description: 选择源码分支
        required: true
        default: "main"
        options:
        - main

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: 获得当前的时间
        id: time
        uses: nanzm/get-time-action@master
        with:
          timeZone: Asia/Shanghai
          format: 'YYYY-MM-DD-HH:mm:ss'
          
      - name: 设置变量
        id: get
        run: |
           TIME=${{ steps.time.outputs.time }}
           title_tag="Armbian 玩客云三代(WS1608)官方镜像"-${TIME}
           export Onecloud_Time_bulid_title=${title_tag}
           echo $Onecloud_Time_bulid_title
           
           echo "Onecloud_Time_bulid_title=$Onecloud_Time_bulid_title" >> $GITHUB_ENV
           echo ${{ env.Onecloud_Time_bulid_title }}

    outputs:
      Onecloud_Time_bulid_title: ${{ steps.get.outputs.Onecloud_Time_bulid_title }}
      
  armbian_build_core:
    name: armbian-"${{ matrix.RELEASE }}"-"${{ matrix.TYPE }}"-固件编译
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        RELEASE:
          # - focal # Ubuntu 20.04 LTS
          # - jammy # Ubuntu 22.04 LTS
          - noble # Ubuntu 24.04 LTS
          #- oracular # Ubuntu 24.10
          - plucky # Ubuntu 25.04
          # - buster # Debian 10
          # - bullseye # Debian 11
          - bookworm # Debian 12
          - trixie # Debian 13
          - sid # Debian unstable
        TYPE:
          - minimal
          - server
          #- xfce
          
    steps:
      - uses: rmoyulong/build@main
        with:
          armbian_token:    "${{ secrets.GITHUB_TOKEN }}"  # GitHub token
          armbian_release:    "${{ matrix.RELEASE }}"                        # userspace
          armbian_target:    "build"                        # build=image, kernel=kernel
          armbian_board:    "onecloud"                   # build target
          armbian_branch:    "${{ inputs.branch_version }}"
          armbian_kernel_branch:    "current"
          armbian_ui:    "${{ matrix.TYPE }}"
          armbian_release_title:    "${{ needs.prepare.outputs.Onecloud_Time_bulid_TAG }}"
